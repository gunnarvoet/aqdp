[project]
name = "aqdp"
version = "0.1.0"
description = "Nortek Aquadopp data processing: read text exports, write CF-compliant NetCDF"
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "netcdf4",
    "numpy",
    "pandas",
    "click",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
aqdp = "aqdp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqdp"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
