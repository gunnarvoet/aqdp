[project]
name = "aqdp"
version = "0.1.0"
authors = [
    {name = "Gunnar Voet", email = "gvoet@ucsd.edu"},
    ]
description = "Nortek Aquadopp data processing: read text exports, write CF-compliant NetCDF"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["physical oceanography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Oceanography",
    ]
requires-python = ">=3.12"
dependencies = [
    "xarray",
    "netcdf4",
    "numpy",
    "pandas",
    "click",
    "pyyaml",
    "matplotlib",
]

[project.urls]
Repository = "https://github.com/gunnarvoet/aqdp.git"
Issues = "https://github.com/gunnarvoet/aqdp/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
aqdp = "aqdp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqdp"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
